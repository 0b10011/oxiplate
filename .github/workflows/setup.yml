name: setup

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to use"
        type: string
      cargo-deny-version:
        description: "Version of `cargo-deny` to use"
        type: string
        default: "0.19.0"
    outputs:
      cache-path:
        description: "Path for restoring cache item"
        value: ${{ jobs.setup.outputs.cache-path }}
      cache-key:
        description: "Key for restoring cache item"
        value: ${{ jobs.setup.outputs.cache-key }}

concurrency:
  group: "setup:${{ github.workflow }}:${{ inputs.toolchain }}:${{ github.ref }}"

env:
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-path: ${{ steps.key.outputs.cache-path }}
      cache-key: ${{ steps.key.outputs.cache-key }}
    steps:
      - name: Validate `cargo-deny` version format
        env:
          VERSION: ${{ inputs.cargo-deny-version }}
          # Regex from <https://semver.org/>
          # with `[0-9]` instead of `\d`
          # and `?:` removed.
          VERSION_REGEX: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\\+([0-9a-zA-Z-]+(\\.[0-9a-zA-Z-]+)*))?$"
        run: |
          echo "Checking `cargo-deny` version '$VERSION' format..."
          if [[ ! $VERSION =~ $VERSION_REGEX ]]; then
            echo "'$VERSION' is not in the expected format '$VERSION_REGEX'" 1>&2
            exit 1
          fi
          echo "`cargo-deny` version '$VERSION' is in a valid format"

      # Checkout immediately so file hashing works
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Save cache path and key to output
        id: key
        env:
          CACHE_PATH: |
            ~/.cargo/
            target/
          CACHE_KEY: "setup:${{ inputs.toolchain }}:${{ hashFiles('.github/workflows/setup.yml', 'justfile', 'Cargo.lock', 'rust-toolchain.toml') }}"
        run: |
          {
            echo 'cache-path<<EOF'
            echo "$CACHE_PATH"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          {
            echo 'cache-key<<EOF'
            echo "$CACHE_KEY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # If the item already exists, skip to end
      - name: Lookup cache
        id: lookup
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v5
        with:
          path: ${{ steps.key.outputs.cache-path }}
          key: ${{ steps.key.outputs.cache-key }}
          lookup-only: true

      - name: Install Rust toolchain
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Install `just`
        if: steps.lookup.outputs.cache-hit != 'true'
        run: cargo +${{ inputs.toolchain }} install --locked just@1.53.0

      - name: Install `cargo-deny`
        if: steps.lookup.outputs.cache-hit != 'true'
        run: cargo +${{ inputs.toolchain }} install --locked cargo-deny@${{ inputs.cargo-deny-version }}

      - name: Fetch dependencies
        if: steps.lookup.outputs.cache-hit != 'true'
        run: cargo +${{ inputs.toolchain }} fetch --target host-tuple

      - name: Save cache
        if: steps.lookup.outputs.cache-hit != 'true'
        id: save
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v5
        with:
          path: ${{ steps.key.outputs.cache-path }}
          key: ${{ steps.key.outputs.cache-key }}

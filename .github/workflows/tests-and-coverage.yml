name: tests-and-coverage

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}:${{ github.ref }}"

env:
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  get-toolchain:
    uses: ./.github/workflows/existing-toolchain.yml

  tests-and-coverage:
    needs: [get-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: ${{ needs.get-toolchain.outputs.toolchain }}
          components: "clippy, rust-src, llvm-tools-preview"
          setup-coverage: true
          # For `no_std` build confirmation
          target: "x86_64-unknown-none"

      - name: Cache tests and coverage setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/
            target/
          key: tests-and-coverage:${{ needs.get-toolchain.outputs.toolchain }}-${{ hashFiles('.github/workflows/tests-and-coverage.yml', 'justfile', 'Cargo.lock') }}

      - name: Run tests and coverage
        run: just setup-coverage coverage-lcov build-no-std ''

      - name: Coveralls upload
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: target/test-coverage/lcov.info
          format: lcov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check-nightly-deps:
    needs: [get-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: ${{ needs.get-toolchain.outputs.toolchain }}
          setup-deny: true

      - name: Run tests and coverage
        run: just check-deps ''

  get-msrv:
    needs: [get-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: ${{ needs.get-toolchain.outputs.toolchain }}

      - name: Get `rust-version` from `/Cargo.toml`
        id: msrv
        run: |
          MSRV="$(just get-msrv)"

          SAFE_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! $MSRV =~ $SAFE_REGEX ]]; then
            echo '`rust-version` value in "/Cargo.toml" is not in `#.#.#` format'
            exit 1
          fi

          echo "msrv=$MSRV" >> $GITHUB_OUTPUT

  test-msrv:
    needs: [get-msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: ${{ needs.get-msrv.outputs.msrv }}
          # just@1.53.0 is the latest version to support rust versions prior to 1.89.0.
          just-version: "1.53.0"
          # cargo-deny@0.18.3 is the latest version to support rust versions prior to 1.88.0.
          cargo-deny-version: "0.18.3"
          # `cargo fetch` doesn't support "host-tuple" until 1.91.0.
          # See: <https://releases.rs/docs/1.91.0/#cargo>
          fetch-target: "x86_64-unknown-linux-gnu"
          setup-deny: true
          # For `no_std` build confirmation
          target: "x86_64-unknown-none"

      - name: Run tests
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.get-msrv.outputs.msrv }}
        # cargo-deny@0.18.3 is the latest version to support rust versions prior to 1.88.0.
        # An alternate config is used due to newer keys not being supported.
        run: |
          cargo deny check --config deny-0.18.3.toml licenses bans sources
          just test-toolchain '${{ needs.get-msrv.outputs.msrv }}'

  test-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: stable
          setup-deny: true
          # For `no_std` build confirmation
          target: "x86_64-unknown-none"

      - name: Run tests
        env:
          RUSTUP_TOOLCHAIN: stable
        run: just check-deps stable test-toolchain stable

  test-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: beta
          setup-deny: true
          # For `no_std` build confirmation
          target: "x86_64-unknown-none"

      - name: Run tests
        env:
          RUSTUP_TOOLCHAIN: beta
        run: just check-deps beta test-toolchain beta

  book-tests:
    needs: get-toolchain
    uses: ./.github/workflows/book-tests.yml
    with:
      toolchain: ${{ needs.get-toolchain.outputs.toolchain }}

  expansion-tests:
    needs: [get-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: ${{ needs.get-toolchain.outputs.toolchain }}
          setup-expansion: true
          components: "rustfmt"

      - name: Cache expansion tests setup
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/
            target/
          key: expansion-tests:${{ needs.get-toolchain.outputs.toolchain }}:${{ hashFiles('.github/workflows/tests-and-coverage.yml', 'justfile', 'Cargo.lock') }}

      - name: Expansion tests
        run: just expansion-tests

  check-format:
    needs: [get-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: ${{ needs.get-toolchain.outputs.toolchain }}
          components: rustfmt

      - name: Check formatting
        run: just format-check

  clippy:
    needs: [get-toolchain]
    runs-on: ubuntu-latest
    steps:
      - name: Setup and checkout
        uses: $/.github/actions/setup-and-checkout
        with:
          toolchain: ${{ needs.get-toolchain.outputs.toolchain }}
          components: rustfmt

      - name: Check formatting
        run: just clippy-strict

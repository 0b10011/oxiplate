name: book-tests

on:
  workflow_call:
    inputs:
      toolchain:
        description: "Rust toolchain to use"
        type: string

concurrency:
  group: "book-tests:${{ github.workflow }}:${{ github.ref }}"

env:
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  book-setup:
    uses: ./.github/workflows/book-setup.yml
    with:
      toolchain: ${{ inputs.toolchain }}

  test:
    needs: book-setup
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Restore book setup cache
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v5
        with:
          path: ${{ needs.book-setup.outputs.cache-path }}
          key: ${{ needs.book-setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Test examples in book
        run: just book-tests
